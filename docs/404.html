<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | MRS Aircraft</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" id="fav">
<meta name="description" content="The page you asked for is not on this site.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a121c" media="(prefers-color-scheme: dark)">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#16202e; --muted:#55627a; --gold:#a8842f; --bd:rgba(11,42,74,.2); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a121c; --fg:#e8edf4; --muted:#a3b0c2; --gold:#dfbe6b; --bd:rgba(160,190,225,.26); } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:2rem;
         background:var(--bg); color:var(--fg); line-height:1.6;
         font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:34rem; }
  p.code { font-family:ui-monospace,monospace; font-size:.75rem; letter-spacing:.16em;
            text-transform:uppercase; color:var(--gold); margin:0 0 1rem; }
  h1 { margin:0; font-size:clamp(2rem,1.4rem+2.5vw,3rem); letter-spacing:-.025em; line-height:1.1; }
  p.body { color:var(--muted); margin:1rem 0 2rem; }
  a { display:inline-flex; align-items:center; gap:.5rem; padding:.8rem 1.35rem;
       border:1.5px solid var(--bd); border-radius:8px; color:inherit; text-decoration:none;
       font-weight:560; font-size:.9375rem; }
  a:hover { border-color:var(--gold); color:var(--gold); }
  a:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
  /* The mark, masked the same way the nav does it, so it takes the page's
     own colour in both schemes. The two urls are absolute so the mark still
     lands on a 404 at any depth, and are rewritten below when the site is
     served from a GitHub Pages project subpath. */
  .mark { position:relative; width:88px; height:42px; margin-bottom:2rem;
    --body:url("/assets/img/mrs-mark-body.svg");
    --wings:url("/assets/img/mrs-mark-wings.svg"); }
  .mark::before, .mark::after { content:""; position:absolute; inset:0;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:left center; mask-position:left center;
    -webkit-mask-size:contain; mask-size:contain; }
  .mark::before { background:currentColor;
    -webkit-mask-image:var(--body); mask-image:var(--body); }
  .mark::after { background:var(--gold);
    -webkit-mask-image:var(--wings); mask-image:var(--wings); }
</style>
</head>
<body>
  <main>
    <div class="mark" role="img" aria-label="MRS Aircraft Private Limited"></div>
    <p class="code">Error 404</p>
    <h1>That page is not here.</h1>
    <p class="body">The link may be out of date, or the page may have moved. Everything on this
    site is reachable from the home page.</p>
    <a href="/" id="home">Go to the home page</a>
  </main>
  <script>
    // On a GitHub Pages project site the whole site lives under /<repo>/, so a
    // bare "/" would leave it. Keep the first path segment in that case.
    var base = "/";
    if (location.hostname.endsWith(".github.io")) {
      var seg = location.pathname.split("/")[1];
      if (seg) base = "/" + seg + "/";
    }
    document.getElementById("home").href = base;
    document.getElementById("fav").href = base + "assets/favicon.svg";
    var m = document.querySelector(".mark").style;
    m.setProperty("--body",  'url("' + base + 'assets/img/mrs-mark-body.svg")');
    m.setProperty("--wings", 'url("' + base + 'assets/img/mrs-mark-wings.svg")');
  </script>
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "ec9c3c9677bd42c5bfb7fd685f2dddd4"}'></script>
</body>
</html>
